org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 网络代理配置（沙箱环境统一走 127.0.0.1:18080）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.svc|*.cluster.local

# 并行构建与缓存
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.wrapper.validate.url=false
