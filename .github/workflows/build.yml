name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Genshin-SpikeGuard-debug
          path: app/build/outputs/apk/debug/*.apk

  release-apk:
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore $HOME/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD || 'android' }}" \
            -alias "${{ secrets.KEY_ALIAS || 'androiddebugkey' }}" \
            -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Genshin SpikeGuard, O=Open Source, C=US" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD || 'android' }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS || 'androiddebugkey' }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD || 'android' }}"

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: app/build/outputs/apk/release/app-release.apk
          asset_name: Genshin-SpikeGuard-${{ github.event.release.tag_name }}.apk
          asset_content_type: application/vnd.android.package-archive
